traversal:
  link_relations: >-
    Every record carries a HAL-style `_links` block with `self`, `collection`, `about`,
    `author`, `wp:featuredmedia`, `wp:attachment`, `wp:term` and a `curies` definition,
    so the graph is walkable from any record without prior knowledge of the routes.
gaps:
- The `team` post type is referenced by the category and post_tag taxonomies in
  /wp/v2/taxonomies but is not itself registered in /wp/v2/types, so team members are
  not reachable through the REST API - only through the rendered site.
- No pipeline, compound, indication, trial or publication-metadata entity exists. The
  drug pipeline shown at https://kallyope.com/pipeline/ is page content, not structured data.
