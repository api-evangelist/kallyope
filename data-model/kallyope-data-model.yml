note: >-
  Entity-relationship graph derived from the registered post types and taxonomies that
  the live API publishes at /wp/v2/types and /wp/v2/taxonomies, plus the term-ID
  reference fields observed on a real `document` record. Kallyope publishes no object
  reference; identifiers are WordPress integer post/term IDs with no prefixes.
api: kallyope:content-api
identifiers:
  scheme: integer
  note: >-
    Post and term IDs are plain auto-increment integers with no type prefix, drawn from
    the same WordPress ID space, so an ID alone does not identify its entity type. The
    `slug` is the stable human-facing key and the `link` field is the canonical URL.
