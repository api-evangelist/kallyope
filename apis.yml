aid: kallyope
name: Kallyope
description: 'Kallyope, Inc. is a New York City clinical-stage biotechnology company,
  founded in 2015 by Columbia University scientists Charles Zuker, Tom Maniatis and
  Richard Axel, that translates the biology of the gut-brain axis into medicines. It
  launched with a $44M Series A and has since raised a $66M Series B, a $112M Series
  C and a $236M Series D co-led by Mubadala Investment Company and The Column Group,
  with backers including Bill Gates, Lux Capital, Polaris Partners, Casdin Capital and
  Alexandria Real Estate Equities. Its proprietary Klarity platform integrates single-cell
  sequencing, pathway circuit mapping, optogenetics and chemogenetics, proprietary human
  genetics, mouse and human organoid systems, and small-molecule and peptide chemistry
  to map the neural circuits underlying migraine and metabolism; lead candidate elismetrep,
  a TRPM8 blocker, is in Phase 3 development for acute migraine. Kallyope publishes no
  developer portal, API reference, SDKs, CLI, status page or public GitHub organization,
  and no OpenAPI, AsyncAPI, GraphQL, MCP or A2A agent-card surface was found on any host.
  Enrichment probing did find one real, anonymous, read-only REST surface: kallyope.com
  runs WordPress and exposes the WordPress REST API publicly at https://kallyope.com/wp-json,
  carrying the company news feed, site pages, media library and a first-party "document"
  content type of scientific posters, presentations and publications classified by the
  custom program, event, content-type and document-type taxonomies.'
