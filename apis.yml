apis:
- aid: kallyope:content-api
  name: Kallyope Content REST API
  description: 'Anonymous, read-only REST surface behind kallyope.com. Kallyope runs
    WordPress and exposes the WordPress REST API publicly at https://kallyope.com/wp-json
    with 326 registered routes across 14 namespaces. The publicly readable surface is
    the stock wp/v2 namespace, which Kallyope has extended with a first-party custom
    post type — "document" (scientific posters, presentations, publications and video)
    — and four first-party custom taxonomies that classify it: program (drug programs,
    e.g. elismetrep), event (scientific congresses such as the American Headache Society
    and Academy of Neurology annual meetings), content-type (presentation, poster,
    publication, video, terms-conditions) and document-type. Alongside those sit the
    core posts (company news), pages, media, categories, users, search, types and
    taxonomies collections. No authentication is required for reads and none of the
    write methods are reachable anonymously; no API keys, rate-limit headers or developer
    documentation are published for it. This is a content and marketing API, not a
    Klarity platform, research-data or clinical API.'
  humanURL: https://kallyope.com/
  baseURL: https://kallyope.com/wp-json
